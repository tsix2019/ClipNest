name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Core tests
        run: dotnet run --project tests/ClipNest.Core.Tests -c Release
      - name: Data tests
        run: dotnet run --project tests/ClipNest.Data.Tests -c Release
      - name: Platform tests
        run: dotnet run --project tests/ClipNest.Platform.Tests -c Release

  publish:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish (Native AOT, self-contained)
        id: aot
        continue-on-error: true
        shell: pwsh
        run: >
          dotnet publish src/ClipNest.App/ClipNest.App.csproj -c Release -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }} -p:WindowsAppSDKSelfContained=true -p:SelfContained=true
          -p:PublishAot=true -o publish/${{ matrix.rid }}

      - name: Publish (fallback, trimmed ReadyToRun)
        if: steps.aot.outcome == 'failure'
        shell: pwsh
        run: >
          Remove-Item -Recurse -Force publish/${{ matrix.rid }} -ErrorAction SilentlyContinue;
          dotnet publish src/ClipNest.App/ClipNest.App.csproj -c Release -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }} -p:WindowsAppSDKSelfContained=true -p:SelfContained=true
          -p:PublishAot=false -p:PublishReadyToRun=true -o publish/${{ matrix.rid }}

      - name: Smoke test (published build starts and renders)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $env:CLIPNEST_DATA = Join-Path $env:RUNNER_TEMP 'cn-data'
          $env:CLIPNEST_SNAPSHOT = Join-Path $env:RUNNER_TEMP 'cn-snap'
          New-Item -ItemType Directory -Force $env:CLIPNEST_DATA | Out-Null
          '{ "LaunchAtStartup": false, "HideFromCapture": false }' | Set-Content (Join-Path $env:CLIPNEST_DATA 'settings.json')
          $p = Start-Process -FilePath publish/${{ matrix.rid }}/ClipNest.exe -PassThru
          $done = Join-Path $env:CLIPNEST_SNAPSHOT 'done.txt'
          for ($i = 0; $i -lt 90 -and -not (Test-Path $done); $i++) { Start-Sleep 1 }
          if (Test-Path $done) { Get-Content $done | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append }
          Get-Content (Join-Path $env:CLIPNEST_DATA 'logs/clipnest.log') -ErrorAction SilentlyContinue
          if (-not (Test-Path $done) -or -not (Select-String -Path $done -Pattern '^ok' -Quiet)) { Stop-Process -Id $p.Id -ErrorAction SilentlyContinue; exit 1 }
          # Errors caught at runtime (e.g. an AOT-only cast failure) still fail the build.
          if (Select-String -Path (Join-Path $env:CLIPNEST_DATA 'logs/clipnest.log') -Pattern '\[ERROR\]' -Quiet) { Write-Error 'ClipNest logged errors during the smoke test'; exit 1 }
          Copy-Item -Recurse $env:CLIPNEST_SNAPSHOT smoke-snapshots

      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'x64' && always()
        with:
          name: smoke-snapshots
          path: smoke-snapshots
          if-no-files-found: ignore

      - name: Package
        shell: pwsh
        run: |
          Get-ChildItem publish/${{ matrix.rid }} -Include *.pdb -Recurse | Remove-Item
          $size = (Get-ChildItem publish/${{ matrix.rid }} -Recurse | Measure-Object Length -Sum).Sum / 1MB
          "Published size: {0:N1} MB (AOT: ${{ steps.aot.outcome }})" -f $size | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath ClipNest-${{ matrix.rid }}.zip
          "Zip size: {0:N1} MB" -f ((Get-Item ClipNest-${{ matrix.rid }}.zip).Length / 1MB) | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Installers (.exe via Inno Setup, .msi via WiX)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $arch = if ('${{ matrix.rid }}' -eq 'win-arm64') { 'arm64' } else { 'x64' }
          $source = (Resolve-Path publish/${{ matrix.rid }}).Path
          New-Item -ItemType Directory -Force dist | Out-Null

          choco install innosetup -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" "/DArch=$arch" "/DSourceDir=$source" "/DOutputDir=$PWD\dist" installer\ClipNest.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

          dotnet tool install --global wix --version 5.0.2
          wix build installer/ClipNest.wxs -arch $arch -d "Version=$version" -d "SourceDir=$source" -d "IconPath=$PWD\src\ClipNest.App\Assets\ClipNest.ico" -o dist/ClipNest-${{ matrix.rid }}.msi
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }

          Get-ChildItem dist -Include *.exe, *.msi -Recurse | ForEach-Object { "{0}: {1:N1} MB" -f $_.Name, ($_.Length / 1MB) } | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v7
        with:
          name: ClipNest-${{ matrix.rid }}
          path: |
            ClipNest-${{ matrix.rid }}.zip
            dist/*.exe
            dist/*.msi

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            # Tags like v0.1.0-beta are pre-releases; plain versions are stable releases.
            $pre = if ($tag.Contains('-')) { '--prerelease' } else { '--latest' }
            gh release create $tag --title "ClipNest $tag" --generate-notes $pre
          }
          gh release upload $tag ClipNest-${{ matrix.rid }}.zip (Get-ChildItem dist/*.exe).FullName (Get-ChildItem dist/*.msi).FullName --clobber
