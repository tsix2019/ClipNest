name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Core tests
        run: dotnet run --project tests/ClipNest.Core.Tests -c Release
      - name: Data tests
        run: dotnet run --project tests/ClipNest.Data.Tests -c Release

  publish:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish (Native AOT, self-contained)
        id: aot
        continue-on-error: true
        shell: pwsh
        run: >
          dotnet publish src/ClipNest.App/ClipNest.App.csproj -c Release -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }} -p:WindowsAppSDKSelfContained=true -p:SelfContained=true
          -p:PublishAot=true -o publish/${{ matrix.rid }}

      - name: Publish (fallback, trimmed ReadyToRun)
        if: steps.aot.outcome == 'failure'
        shell: pwsh
        run: >
          Remove-Item -Recurse -Force publish/${{ matrix.rid }} -ErrorAction SilentlyContinue;
          dotnet publish src/ClipNest.App/ClipNest.App.csproj -c Release -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }} -p:WindowsAppSDKSelfContained=true -p:SelfContained=true
          -p:PublishAot=false -p:PublishReadyToRun=true -o publish/${{ matrix.rid }}

      - name: Smoke test (published build starts and renders)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $env:CLIPNEST_DATA = Join-Path $env:RUNNER_TEMP 'cn-data'
          $env:CLIPNEST_SNAPSHOT = Join-Path $env:RUNNER_TEMP 'cn-snap'
          New-Item -ItemType Directory -Force $env:CLIPNEST_DATA | Out-Null
          '{ "LaunchAtStartup": false, "HideFromCapture": false }' | Set-Content (Join-Path $env:CLIPNEST_DATA 'settings.json')
          $p = Start-Process -FilePath publish/${{ matrix.rid }}/ClipNest.exe -PassThru
          $done = Join-Path $env:CLIPNEST_SNAPSHOT 'done.txt'
          for ($i = 0; $i -lt 90 -and -not (Test-Path $done); $i++) { Start-Sleep 1 }
          if (Test-Path $done) { Get-Content $done | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append }
          Get-Content (Join-Path $env:CLIPNEST_DATA 'logs/clipnest.log') -ErrorAction SilentlyContinue
          if (-not (Test-Path $done) -or -not (Select-String -Path $done -Pattern '^ok' -Quiet)) { Stop-Process -Id $p.Id -ErrorAction SilentlyContinue; exit 1 }
          Copy-Item -Recurse $env:CLIPNEST_SNAPSHOT smoke-snapshots

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'x64' && always()
        with:
          name: smoke-snapshots
          path: smoke-snapshots
          if-no-files-found: ignore

      - name: Package
        shell: pwsh
        run: |
          Get-ChildItem publish/${{ matrix.rid }} -Include *.pdb -Recurse | Remove-Item
          $size = (Get-ChildItem publish/${{ matrix.rid }} -Recurse | Measure-Object Length -Sum).Sum / 1MB
          "Published size: {0:N1} MB (AOT: ${{ steps.aot.outcome }})" -f $size | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath ClipNest-${{ matrix.rid }}.zip
          "Zip size: {0:N1} MB" -f ((Get-Item ClipNest-${{ matrix.rid }}.zip).Length / 1MB) | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v4
        with:
          name: ClipNest-${{ matrix.rid }}
          path: ClipNest-${{ matrix.rid }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null; if ($LASTEXITCODE -ne 0) { gh release create "${{ github.ref_name }}" --title "ClipNest ${{ github.ref_name }}" --generate-notes --prerelease }
          gh release upload "${{ github.ref_name }}" ClipNest-${{ matrix.rid }}.zip --clobber
